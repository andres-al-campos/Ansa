# Regenerate the Xcode project with `xcodegen generate` from this directory.
#
# The .xcodeproj is not committed: it is generated from this file, so the
# project settings live in reviewable YAML rather than in a merge-hostile pbxproj.
# Sources sit flat in Sources/ rather than nested a directory deeper.
#
# AnsaCore is a local SwiftPM package, not a copied folder — the app target
# depends on it the same way the tests do, so `swift test` and the app build
# exercise the same code.
name: Ansa
options:
  bundleIdPrefix: com.id3arium
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AnsaCore:
    path: AnsaCore
  # ClerkKitUI as well as ClerkKit: its prebuilt AuthView already handles email
  # codes, resends, rate limits and OAuth error states, which is a lot of
  # failure-path code to own for a screen seen once per device.
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.2.0

settings:
  base:
    # Signing is left to Xcode's automatic mode with a personal team. The team
    # id is machine-specific, so it is read from Config.xcconfig (gitignored,
    # see Config.example.xcconfig) rather than committed here.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  Ansa:
    type: application
    platform: iOS
    # A shared scheme, so `xcodebuild test` runs the UI tests below.
    scheme:
      testTargets:
        - AnsaUITests
    sources:
      - path: Sources
    dependencies:
      - package: AnsaCore
        product: AnsaCore
      - package: AnsaCore
        product: AnsaSync
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ansa
        UILaunchScreen: {}
        # Injected at build time from the macOS Keychain by build.sh — see
        # ClerkConfig.swift for why this is baked in rather than read at
        # runtime. Publishable, not secret: it ships in every client build.
        ANSAClerkPublishableKey: $(ANSA_CLERK_PUBLISHABLE_KEY)
        # Portrait only: the owner never turns the phone, and every screen
        # then has one shape to get right.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app talks to a local wrangler dev over plain http during
        # development. Scoped to localhost rather than a blanket
        # NSAllowsArbitraryLoads so the production https host is still enforced.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # The catalog holds one 1024 tile; iOS 17 derives every other size from
        # it. Regenerate it with `python3 tools/make-icon.py` — the artwork is
        # drawn from a spec in that script rather than hand-edited.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bundle ids are unique across every Apple developer account, not just
        # ours — com.ansa.app is taken by someone else, and signing fails with
        # "cannot be registered to your development team". Hence the personal
        # prefix rather than the tidier product-shaped one.
        PRODUCT_BUNDLE_IDENTIFIER: com.id3arium.ansa
        # iPhone only. On iPad it runs as a scaled iPhone app, which is enough;
        # as a real iPad app it would have to support upside-down portrait for
        # multitasking, and Xcode warns until it does. (2026-10-19)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false

  # One test per feature, each driving the app the way a person would. Run one
  # with `./build.sh drive <name>`; dev/features/ names each feature's test.
  AnsaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Ansa
    info:
      path: UITests/Info.plist
      properties:
        # The tests seed through the local Worker over plain http, like the app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.id3arium.ansa.uitests
        GENERATE_INFOPLIST_FILE: false
